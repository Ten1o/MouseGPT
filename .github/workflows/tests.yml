name: MouseGPT workflow tests

on:
  pull_request:
  push:
    branches: [main, feat/model-api-config, feat/ui-workbench]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      GRADIO_ANALYTICS_ENABLED: "False"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-assets.txt
            requirements-api.txt
            requirements-dev.txt
            4_NLUI/requirements.txt
            ui/requirements-test.txt
            ui/environments/core.in
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CPU dependencies
        run: python -m pip install -r ui/requirements-test.txt
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline regression and workflow tests
        env:
          MOUSEGPT_UI_HOME: ${{ runner.temp }}/mousegpt-ui-tests
          MPLCONFIGDIR: ${{ runner.temp }}/mousegpt-matplotlib
        run: >-
          python -m pytest -c pytest.ini tests 4_NLUI/tests ui
          1_keypoints/tests/test_batch_vis_ui.py
          1_keypoints/tests/test_convert_sleap.py
          1_keypoints/tests/test_reprojection_ui.py -q
      - name: Check browser review isolation
        run: node --test ui/tests/review_state.test.cjs
